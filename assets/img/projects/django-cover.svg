<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700">
      <stop offset="0%" stop-color="#06172c"></stop>
      <stop offset="48%" stop-color="#0c2e58"></stop>
      <stop offset="100%" stop-color="#252f82"></stop>
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 120) rotate(35) scale(520 360)">
      <stop stop-color="#20e3b2" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#20e3b2" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 560) rotate(20) scale(520 260)">
      <stop stop-color="#2ea0ff" stop-opacity="0.28"></stop>
      <stop offset="1" stop-color="#2ea0ff" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="10"></feGaussianBlur>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.32"></feDropShadow>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="34" fill="url(#bg)"></rect>
  <rect width="1200" height="700" rx="34" fill="url(#glow1)"></rect>
  <rect width="1200" height="700" rx="34" fill="url(#glow2)"></rect>
  <rect x="1" y="1" width="1198" height="698" rx="33" stroke="white" stroke-opacity="0.10"></rect>

  <circle cx="970" cy="160" r="160" fill="#2ea0ff" fill-opacity="0.08" filter="url(#softBlur)"></circle>
  <circle cx="1040" cy="250" r="110" fill="#6a5cff" fill-opacity="0.12" filter="url(#softBlur)"></circle>

  <text x="90" y="135" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">
    Django CRUD
  </text>

  <text x="90" y="230" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="900">
    Gestor de Tareas
  </text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="300" width="560" height="230" rx="24" fill="white" fill-opacity="0.075"></rect>
    <rect x="90.5" y="300.5" width="559" height="229" rx="23.5" stroke="white" stroke-opacity="0.13"></rect>
  </g>

  <text x="125" y="365" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">
    Portfolio Project
  </text>

  <rect x="125" y="392" width="180" height="4" rx="2" fill="#2ea0ff" opacity="0.95"></rect>
  <rect x="318" y="392" width="80" height="4" rx="2" fill="#20e3b2" opacity="0.55"></rect>

  <text x="125" y="455" fill="#d7deee" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
    Python · Django · SQLite
  </text>

  <text x="125" y="500" fill="#d7deee" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">
    CRUD · CSV Import/Export
  </text>

  <path d="M-80 625 C120 535 290 690 500 610 C760 510 940 675 1280 550" stroke="#34b8ff" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.16" filter="url(#softBlur)"></path>
</svg>